name: Release Draft
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - name: Check release version and tag
        shell: bash
        run: |
          node -e "const p=require('./package.json'),m=require('./manifest.json'),v=require('./versions.json'); if(p.version!==m.version || !v[p.version]) process.exit(1)"
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$VERSION"
      - name: Create draft with plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
